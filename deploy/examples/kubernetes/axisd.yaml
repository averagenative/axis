# axisd.yaml - the Axis daemon and its Service
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# ONE replica, replaced with Recreate: Axis is a single long-lived process
# per database (its job queue, sessions and in-flight guards assume it), so
# two daemons on one database are not supported, not even for the seconds a
# rolling update would overlap them.  Workers are what scale out
# (worker.yaml).
apiVersion: v1
kind: Service
metadata:
  name: axisd
  labels:
    app.kubernetes.io/name: axis
    app.kubernetes.io/component: daemon
spec:
  selector:
    app.kubernetes.io/name: axis
    app.kubernetes.io/component: daemon
  ports:
    - name: http
      port: 7800
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axisd
  labels:
    app.kubernetes.io/name: axis
    app.kubernetes.io/component: daemon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: axis
      app.kubernetes.io/component: daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axis
        app.kubernetes.io/component: daemon
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # axisd gives running jobs 30 seconds (AXIS_JOBS_GRACE_PERIOD), then
      # hands back what is left and exits.
      terminationGracePeriodSeconds: 45
      # Any user and group work.  The data volume is given to fsGroup, which
      # Axis accepts as its own when that group may write it.  For an
      # arbitrary user id (OpenShift), leave runAsUser out and keep group 0.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: axisd
          # EDIT: the published image (the release candidate 0.1.0-rc2 for
          # now; the minor line "0.1" exists from the first final release
          # on), or one you built and pushed to your own registry.
          image: ghcr.io/averagenative/axis:0.1.0-rc2
          ports:
            - name: http
              containerPort: 7800
          env:
            - name: AXIS_DATABASE_URL_FILE
              value: /run/secrets/axis/database-url
            # A directory Axis makes itself inside the volume (mode 0700),
            # so that the volume's own permissions do not matter: some
            # provisioners (local-path, as k3s and kind use) make every
            # volume writable by everyone, which Axis refuses.
            - name: AXIS_DATA_DIR
              value: /var/lib/axis/data
            # The first administrator, created while no account exists.
            - name: AXIS_ADMIN_USERNAME
              value: admin
            - name: AXIS_ADMIN_PASSWORD_FILE
              value: /run/secrets/axis/admin-password
            # EDIT: the addresses your ingress controller's pods have (the
            # pod network's range), so that Axis believes their
            # X-Forwarded-* headers and nobody else's.  A host name works
            # too if it resolves to the controller's pod addresses (a
            # headless Service does; an ordinary Service's name gives its
            # cluster address, which is not the address the pods connect
            # from).
            - name: AXIS_TRUSTED_PROXIES
              value: 10.42.0.0/16
            - name: AXIS_LOG_FORMAT
              value: json
            # Prometheus (optional): put a token in the secret as
            # metrics-token, add it to the items below, and uncomment.
            # - name: AXIS_METRICS_TOKEN_FILE
            #   value: /run/secrets/axis/metrics-token
          # Alive: the process answers.  Ready: the database answers and is
          # at this build's schema.  Before its database is up, the daemon is
          # alive, not ready, and keeps trying; it does not exit.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # Two password hashes at once take up to 256 MiB each.
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/axis
            # The one media volume: downloads/ and media/ below /data.
            - name: media
              mountPath: /data
            - name: secrets
              mountPath: /run/secrets/axis
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: axis-data
        - name: media
          persistentVolumeClaim:
            claimName: axis-media
        # EDIT: or a disk on the node itself (one node only):
        # - name: media
        #   hostPath:
        #     path: /path/to/data
        #     type: Directory
        - name: secrets
          secret:
            secretName: axis-secrets
            defaultMode: 0440
            items:
              - key: database-url
                path: database-url
              - key: admin-password
                path: admin-password
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
