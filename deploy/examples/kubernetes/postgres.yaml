# postgres.yaml - a PostgreSQL for Axis, for convenience
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# If you run PostgreSQL already (15 or newer), leave this file out of
# kustomization.yaml and point the database-url secret at yours.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: axis
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: axis
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: axis
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: axis
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axis
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: axis
            - name: POSTGRES_DB
              value: axis
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/axis/db-password
            # Page checksums; applies only when the database is first created.
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            # A directory below the mount: a fresh volume may hold lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "--username=axis", "--dbname=axis"]
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: db
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /run/secrets/axis
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: axis-secrets
            defaultMode: 0440
            items:
              - key: db-password
                path: db-password
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: db
        labels:
          app.kubernetes.io/name: axis
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
