# checks.yml - run the four gates on every push to main
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# It runs the checks, and nothing else: it builds no image for anyone, pushes
# nothing and publishes nothing.  The four gates of the README ("Build from
# source") each run in a job of their own:
#
#   check            make check              every test under AddressSanitizer
#                                            and UndefinedBehaviorSanitizer,
#                                            against a throwaway PostgreSQL;
#                                            compiles the fuzz targets
#   fuzz             make fuzz               every fuzz target for 20 seconds
#   check-container  make check-container    builds the image and checks its
#                                            hardening, probes and secrets
#   check-examples   make check-examples     runs the Compose, full-stack,
#                                            Traefik, Quadlet and remote
#                                            worker examples
#
# The four jobs start together, do not wait for each other and do not stop
# each other: when one fails, the other three still run to their end, so one
# run says everything that is wrong with a commit.  A run with four green
# jobs is the sign that the commit can be deployed.
#
# WHEN IT RUNS.  On every push to main, and when started by hand from the
# Actions tab (on any branch).  Runs are not grouped and never cancel each
# other: two pushes in a row give two whole runs, one for each commit.
#
# NOT ON PULL REQUESTS, on purpose.  A pull request from a fork is code that
# nobody here has read, and these jobs compile and run whatever the commit
# holds.  It is checked after it has been read: by the person who merges it
# (the same four commands, see the README), and here once it is on main.
#
# WHERE IT RUNS.  On GitHub's standard runners for public repositories, which
# cost nothing: never a larger runner.  All four jobs run on Ubuntu 26.04,
# straight on the runner and not in a container, because two of them start
# containers themselves.  Ubuntu 24.04 was tried first and is too old in two
# places, both seen in a run:
#   - its Podman is 4.9, and the Quadlet example needs Podman 5 (the
#     generator refuses the example's files);
#   - its ffmpeg is 6.1, with which a converted test clip has one video
#     packet more than its original, so the conversion's own check rejects
#     it and tests/test-conversion.c fails.  The image ships ffmpeg 7.1.
# Ubuntu's own packages are used; the list is the one of the build stage of
# deploy/Containerfile (Debian's names are Ubuntu's), with what the checks
# need on top: clang for the fuzz targets, ffmpeg and ffprobe for the tests
# that make and read small media files, and strace for the test that watches
# a worker's system calls.  The apt packages are not cached: installing them
# takes half a minute, and a few minutes on a day when the mirror is slow.
#
# WHAT IS DIFFERENT FROM A DEVELOPER'S MACHINE, each for a stated reason:
#   - Ubuntu refuses user namespaces to programs without an AppArmor profile.
#     Several tests mount a private tmpfs in one, and would skip themselves;
#     the check job lifts that restriction for its own, throwaway machine.
#   - A runner's user has no systemd session.  Podman's health checks and the
#     Quadlet example need one, so the two container jobs start one (lingering).
#   - Podman would hand `podman compose` to Docker's Compose plugin, which the
#     runner has; the examples are written for and checked with podman-compose,
#     so the check-examples job installs it (one version, named below) and
#     names it as the provider.
#   - `make check-examples` skips a part whose prerequisite is missing, and
#     says so, because on someone's own machine that is no failure.  Here every
#     prerequisite is installed, so a skipped part is a failure of the job.
#   - `make check` names the tests that skipped themselves in the run's
#     summary, with their reasons.  The hardware encoder tests always do: no
#     check ever runs a hardware encoder.
#
# WHEN A JOB FAILS it prints the end of its log once more as its last step
# (`make check` and `make fuzz` end with the whole log of each program that
# failed, and their names), and keeps for a week, as an artifact, the job's
# log and the log of every test program or fuzz target.
#
# PARALLEL TESTS.  The compilers run on every core (`make -j`), and the test
# programs and the fuzz targets run several at a time (TEST_JOBS, FUZZ_JOBS).
# The one place where those two numbers are set is the `env` block below,
# marked PARALLEL TESTS.
#
# The private word list that `make check-made-up` can read from
# AXIS_MADE_UP_PRIVATE_WORDS is not given here; the check runs without it.
#
# The actions are referred to by major version tag, as in images.yml.  They
# should be pinned to full commit SHAs (with the version in a comment).

name: checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# No `concurrency` block, on purpose: a group would let a newer push take the
# place of an older one that is still waiting, and that commit would never
# get its answer.

env:
  # PARALLEL TESTS: the one place.  How many test programs and how many fuzz
  # targets run at a time (config.mk).  A standard runner has 4 processors
  # and 16 GB.  A fuzz target needs a processor of its own for its whole
  # FUZZ_SECONDS, so FUZZ_JOBS stays at the number of processors.
  TEST_JOBS: 4
  FUZZ_JOBS: 4
  FUZZ_SECONDS: 20
  # The version of podman-compose the examples are checked with.  The name
  # must not start with PODMAN_COMPOSE_: podman-compose reads every such
  # variable as a setting of its own, and warns about one it does not know.
  COMPOSE_FRONT_END_VERSION: 1.6.0

jobs:
  check:
    name: make check
    runs-on: ubuntu-26.04
    # About 40 minutes when it passes: 2 to compile, 23 for the tests, 13
    # for the fuzz targets' compile (measured; the compile varies by half
    # between one runner and the next).
    timeout-minutes: 120
    permissions:
      contents: read      # check out the source
    steps:
      # TODO: pin to a commit SHA.
      - name: Check out (with the htmx-glib submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      # The first list is deploy/Containerfile's build stage.  clang is
      # installed with what it recommends: libFuzzer and its sanitizer
      # runtimes are in a recommended package.
      - name: Install the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              binutils ca-certificates gcc glib-networking libc6-dev \
              libglib2.0-dev libjson-glib-dev libpq-dev libsodium-dev \
              libsoup-3.0-dev make pkg-config \
              ffmpeg python3 strace
          sudo apt-get install -y clang podman

      # Ubuntu's restriction on user namespaces (see the header).  The tests
      # that need one skip themselves without it; this makes them run.
      - name: Allow user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --mount true

      - name: What is installed
        run: |
          gcc --version
          clang --version
          make --version
          pkg-config --modversion glib-2.0 libsoup-3.0 json-glib-1.0 libpq libsodium
          ffmpeg -version
          ffprobe -version
          strace --version
          podman --version
          nproc
          free -m
          df -h /

      - name: make check
        run: |
          set -o pipefail
          SECONDS=0
          make -j"$(nproc)" check 2>&1 | tee "$RUNNER_TEMP/check.log"
          echo "\`make check\` passed in $((SECONDS / 60)) min $((SECONDS % 60)) s." >> "$GITHUB_STEP_SUMMARY"

      # Never silently: every test that skipped itself, with its reason, from
      # each test program's own log, and anything make itself left out.  The
      # list goes to the run's summary and to this job's log.
      - name: Name the tests that skipped themselves
        if: ${{ always() }}
        run: |
          {
              echo "### Tests that skipped themselves"
              echo
              echo '```'
              grep -E '^  SKIP ' "$RUNNER_TEMP/check.log" || true
              (cd build/gcc-debug-asan-ubsan/test-logs && grep -E '# SKIP' -- *.log) || echo "no test skipped itself"
              echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The end of the log, once more
        if: ${{ failure() || cancelled() }}
        run: tail -n 400 "$RUNNER_TEMP/check.log"

      # TODO: pin to a commit SHA.
      - name: Keep the logs
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            ${{ runner.temp }}/check.log
            build/gcc-debug-asan-ubsan/test-logs
          if-no-files-found: warn
          retention-days: 7

  fuzz:
    name: make fuzz
    runs-on: ubuntu-26.04
    # 18 to 24 minutes when it passes: 11 to 18 to compile, 5 to run.
    timeout-minutes: 90
    permissions:
      contents: read      # check out the source
    steps:
      # TODO: pin to a commit SHA.
      - name: Check out (with the htmx-glib submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      # The fuzz targets need GLib alone, but make asks for every package of
      # config.mk before it builds anything.
      - name: Install the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              binutils ca-certificates gcc glib-networking libc6-dev \
              libglib2.0-dev libjson-glib-dev libpq-dev libsodium-dev \
              libsoup-3.0-dev make pkg-config
          sudo apt-get install -y clang

      - name: What is installed
        run: |
          clang --version
          make --version
          pkg-config --modversion glib-2.0
          nproc

      - name: Compile the fuzz targets
        run: |
          set -o pipefail
          SECONDS=0
          make -j"$(nproc)" fuzz-build 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
          echo "The fuzz targets compiled in $((SECONDS / 60)) min $((SECONDS % 60)) s." >> "$GITHUB_STEP_SUMMARY"

      - name: make fuzz
        run: |
          set -o pipefail
          SECONDS=0
          make -j"$(nproc)" fuzz FUZZ_SECONDS="$FUZZ_SECONDS" 2>&1 | tee -a "$RUNNER_TEMP/fuzz.log"
          echo "\`make fuzz FUZZ_SECONDS=$FUZZ_SECONDS\` passed in $((SECONDS / 60)) min $((SECONDS % 60)) s." >> "$GITHUB_STEP_SUMMARY"

      - name: The end of the log, once more
        if: ${{ failure() || cancelled() }}
        run: tail -n 400 "$RUNNER_TEMP/fuzz.log"

      # The inputs that crashed a target are kept with the log.
      # TODO: pin to a commit SHA.
      - name: Keep the logs and what crashed
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs
          path: |
            ${{ runner.temp }}/fuzz.log
            build/fuzz/logs
            build/fuzz/artifacts
          if-no-files-found: warn
          retention-days: 7

  check-container:
    name: make check-container
    runs-on: ubuntu-26.04
    # About 8 minutes when it passes.
    timeout-minutes: 45
    permissions:
      contents: read      # check out the source
    steps:
      # TODO: pin to a commit SHA.
      - name: Check out (with the htmx-glib submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      # No compiler and no -dev package: the image is compiled inside a
      # container (config.mk, NO_HOST_BUILD_GOALS).  yq is the runner's own.
      - name: Install the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y podman dbus-user-session curl openssl make iproute2

      # Podman runs a container's health check from a systemd timer of the
      # user's session; a runner's user has no session until it lingers.
      - name: Start a systemd session for the runner's user
        run: |
          sudo loginctl enable-linger "$(id -un)"
          dir=/run/user/$(id -u)
          n=0
          until [ -S "$dir/bus" ]; do
              n=$((n + 1))
              [ "$n" -lt 60 ] || { echo "no session bus at $dir/bus after 60 s" >&2; exit 1; }
              sleep 1
          done
          echo "XDG_RUNTIME_DIR=$dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$dir/bus" >> "$GITHUB_ENV"

      - name: What is installed
        run: |
          podman --version
          podman info
          yq --version
          curl --version
          openssl version
          systemctl --user is-system-running || true
          nproc
          free -m
          df -h /

      - name: make check-container
        run: |
          set -o pipefail
          SECONDS=0
          make check-container 2>&1 | tee "$RUNNER_TEMP/check-container.log"
          echo "\`make check-container\` passed in $((SECONDS / 60)) min $((SECONDS % 60)) s." >> "$GITHUB_STEP_SUMMARY"

      - name: The end of the log, once more
        if: ${{ failure() || cancelled() }}
        run: tail -n 400 "$RUNNER_TEMP/check-container.log"

      # TODO: pin to a commit SHA.
      - name: Keep the log
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-container-log
          path: ${{ runner.temp }}/check-container.log
          if-no-files-found: warn
          retention-days: 7

  check-examples:
    name: make check-examples
    runs-on: ubuntu-26.04
    # About 11 minutes when it passes.
    timeout-minutes: 60
    permissions:
      contents: read      # check out the source
    steps:
      # TODO: pin to a commit SHA.
      - name: Check out (with the htmx-glib submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install the packages
        run: |
          sudo apt-get update
          sudo apt-get install -y podman dbus-user-session curl openssl make iproute2 pipx
          pipx install "podman-compose==$COMPOSE_FRONT_END_VERSION"
          echo "PODMAN_COMPOSE_PROVIDER=$(command -v podman-compose)" >> "$GITHUB_ENV"

      # The Quadlet example is installed for this user and started with
      # `systemctl --user`, and Podman's health checks are timers of the
      # user's session; a runner's user has no session until it lingers.
      - name: Start a systemd session for the runner's user
        run: |
          sudo loginctl enable-linger "$(id -un)"
          dir=/run/user/$(id -u)
          n=0
          until [ -S "$dir/bus" ]; do
              n=$((n + 1))
              [ "$n" -lt 60 ] || { echo "no session bus at $dir/bus after 60 s" >&2; exit 1; }
              sleep 1
          done
          echo "XDG_RUNTIME_DIR=$dir" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$dir/bus" >> "$GITHUB_ENV"

      - name: What is installed
        run: |
          podman --version
          podman info
          podman compose version
          ls -l /usr/libexec/podman/quadlet
          curl --version
          openssl version
          systemctl --user is-system-running || true
          nproc
          free -m
          df -h /

      # The examples run the image `make container` builds.
      - name: Build the image
        run: |
          set -o pipefail
          SECONDS=0
          make container 2>&1 | tee "$RUNNER_TEMP/check-examples.log"
          echo "The image was built in $((SECONDS / 60)) min $((SECONDS % 60)) s." >> "$GITHUB_STEP_SUMMARY"

      - name: make check-examples
        run: |
          set -o pipefail
          SECONDS=0
          make check-examples 2>&1 | tee -a "$RUNNER_TEMP/check-examples.log"
          echo "\`make check-examples\` passed in $((SECONDS / 60)) min $((SECONDS % 60)) s." >> "$GITHUB_STEP_SUMMARY"

      # On someone's own machine a skipped part is no failure.  Here every
      # prerequisite was installed above, so a skipped part means that this
      # run did not check what it says it checks.
      - name: Nothing was skipped
        run: |
          if grep -E '^  skipped ' "$RUNNER_TEMP/check-examples.log"; then
              echo "::error::make check-examples skipped a part (the lines above); on a runner every part must run"
              exit 1
          fi

      - name: The end of the log, once more
        if: ${{ failure() || cancelled() }}
        run: tail -n 400 "$RUNNER_TEMP/check-examples.log"

      # TODO: pin to a commit SHA.
      - name: Keep the log
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-examples-log
          path: ${{ runner.temp }}/check-examples.log
          if-no-files-found: warn
          retention-days: 7
