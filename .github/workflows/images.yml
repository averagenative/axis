# images.yml - build, sign and publish the Axis container images
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# It builds images, and nothing else.  Nothing here runs on a pull request or
# a branch push.
#
# Every night it also builds the main branch and publishes it as `nightly`,
# unless main has no commit from the last day.
#
# On a version tag (v1.2.3, or a pre-release such as v1.2.3-rc1), or when
# started by hand from the Actions tab, it builds deploy/Containerfile for
# linux/amd64 and linux/arm64, each in a job of its own on a runner of that
# architecture (nothing is emulated), pushes the image to the GitHub Container
# Registry, and signs it with cosign, keyless (GitHub's OIDC identity,
# recorded in the public Sigstore transparency log).  The build stage of the
# Containerfile compiles and runs the unit tests that need no database, so
# each architecture is tested where it is built.
#
# The two architectures do not wait for each other and do not fail each
# other.  The publish job joins what was built under the image's names: when
# one architecture fails, the image is published with the other alone and the
# run is marked failed.  "Re-run failed jobs" on that run then builds the
# missing architecture and publishes the image again with both.  Started by
# hand, the workflow can also be told to build one architecture only.
#
# Tag policy (deploy/README.md, "Published images"):
#   v1.2.3-rc1 pushed  ->  1.2.3-rc1 and rc (a pre-release: any version tag
#                          with a hyphen suffix; never latest, never 1.2)
#   v1.2.3 pushed      ->  1.2.3, 1.2 and latest
#   started by hand    ->  on a version tag, what a push of that tag gives;
#                          anywhere else sha-<commit> only, the only name
#                          such a build can have
#   the nightly build  ->  nightly only (the main branch as it was that
#                          night; the image's revision label names the commit)
#
# The version in the tag must be config.mk's: the image build stops when the
# program it built reports another version (deploy/Containerfile).
#
# The actions are referred to by major version tag.  They should be pinned to
# full commit SHAs (with the version in a comment) before the first release:
# the SHAs were not known for certain when this file was written.

name: images

on:
  push:
    # A filter pattern matches the whole tag name, so the pre-releases need
    # a pattern of their own.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # 07:17 UTC: off the hour, when scheduled runs start late.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      architectures:
        description: Which architectures to build
        type: choice
        default: both
        options:
          - both
          - amd64
          - arm64

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/averagenative/axis

jobs:
  # The names this build gets, worked out once for the jobs below.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read      # read the head commit's date
    outputs:
      build: ${{ steps.new.outputs.build }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      day: ${{ steps.day.outputs.day }}
    steps:
      # A nightly run builds only when main's head commit is from the last
      # day (26 hours, to allow a late start); every other run builds.
      - name: Is there anything new
        id: new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          build=true
          if [ "${GITHUB_EVENT_NAME}" = schedule ]; then
              when=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.committer.date)
              age=$(( $(date -u +%s) - $(date -u -d "$when" +%s) ))
              echo "the head commit is ${age} seconds old"
              [ "$age" -le 93600 ] || build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # The tag policy in the header.  type=semver gives nothing off a tag,
      # and leaves {{major}}.{{minor}} out for a pre-release by itself; rc
      # and latest are told apart by the hyphen in the tag's name; the commit
      # names a build only where no version tag does.  The first line is
      # also the `version` output, which the builds below are given:
      # 1.2.3-rc1 or 1.2.3 on a tag, nightly at night, sha-<commit> anywhere
      # else.
      # TODO: pin to a commit SHA.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=rc,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=sha,format=short,enable=${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Axis
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # yt-dlp is the newest release of the day of the build: the date as a
      # build argument makes its stage run again whatever layers are cached
      # (deploy/Containerfile, the ytdlp stage).  One date for both
      # architectures, whichever side of midnight each starts on.
      - name: The day of the build
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

  # One architecture, built and tested on a runner of that architecture and
  # pushed under its digest alone: it has no name until the publish job
  # gives it one.
  build:
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architectures == 'amd64' && '[{"arch":"amd64","runner":"ubuntu-24.04"}]' || inputs.architectures == 'arm64' && '[{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read      # check out the source
      packages: write     # push to ghcr.io
    steps:
      # TODO: pin to a commit SHA.
      - name: Check out (with the htmx-glib submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      # TODO: pin to a commit SHA.
      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # TODO: pin to a commit SHA.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TODO: pin to a commit SHA.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.plan.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_SHA=${{ github.sha }}
            AXIS_VERSION=${{ needs.plan.outputs.version }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            YTDLP_REFRESH=${{ needs.plan.outputs.day }}
          provenance: true
          sbom: true

      # The digest travels to the publish job as an empty file named after
      # it.
      - name: Note the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      # TODO: pin to a commit SHA.
      - name: Hand the digest on
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Joins what was built under the image's names and signs it.  It runs when
  # one architecture failed too, with the other alone.
  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write     # push to ghcr.io
      id-token: write     # cosign keyless: the workflow's OIDC token
    steps:
      # Every digest this run has: a re-run of one failed architecture finds
      # the other's here from the earlier attempt.
      # TODO: pin to a commit SHA.
      - name: Collect the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      # TODO: pin to a commit SHA.
      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # TODO: pin to a commit SHA.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish under the image's names
        id: publish
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -eu
          sources=""
          for digest in *; do
              [ -f "$digest" ] || { echo "no architecture was built" >&2; exit 1; }
              sources="$sources ${IMAGE}@sha256:${digest}"
          done
          names=""
          for tag in $TAGS; do
              names="$names -t $tag"
          done
          docker buildx imagetools create $names $sources
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in
              sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
              *) echo "the published image has no digest: $digest" >&2; exit 1 ;;
          esac

      # TODO: pin to a commit SHA.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Signs the digest, not a tag, so every tag of this build is covered.
      # Verify with:
      #   cosign verify ghcr.io/averagenative/axis:0.1.0-rc2 \
      #     --certificate-identity-regexp '^https://github.com/averagenative/axis/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
